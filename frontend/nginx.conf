# ============================================================
# NGINX CONFIGURATION
# ============================================================
# Nginx có 2 nhiệm vụ trong project:
#   1. Phục vụ (serve) các file frontend React đã được build.
#   2. Nhận request /api/... và chuyển tiếp (reverse proxy)
#      request đó tới container ASP.NET API.
#
# Frontend React là SPA (Single Page Application):
# sau khi build, frontend chủ yếu được phục vụ từ index.html.
# React Router sẽ tự quyết định hiển thị trang nào dựa trên URL.
# ============================================================

server {

    # Nginx lắng nghe HTTP trên port 80.
    # "_" nghĩa là server block này có thể nhận request
    # cho các domain không được cấu hình cụ thể.
    listen 80;
    server_name _;

    # Thư mục chứa frontend đã được build.
    # Dockerfile sẽ copy /app/dist từ Stage 1 vào thư mục này.
    root /usr/share/nginx/html;

    # File mặc định Nginx trả về khi truy cập "/".
    index index.html;

    # Cho phép client gửi request có body tối đa 200MB.
    # Cần thiết khi Content Manager upload ZIP/audio lớn.
    client_max_body_size 200M;


    # ========================================================
    # FRONTEND — React SPA
    # ========================================================
    #
    # Mọi request không bắt đầu bằng /api/ sẽ được xử lý ở đây.
    #
    # Nginx thử lần lượt:
    #   1. $uri  : tìm file có đúng đường dẫn request.
    #   2. $uri/ : nếu không có file, thử tìm thư mục.
    #   3. /index.html : nếu cả hai đều không tồn tại,
    #                    trả về index.html cho React xử lý.
    #
    # Ví dụ:
    #
    #   /assets/index.js
    #       → có file → trả file đó.
    #
    #   /dashboard
    #       → không có file /dashboard
    #       → trả index.html
    #       → React Router đọc /dashboard
    #       → hiển thị Dashboard.
    #
    # Nhờ /index.html ở cuối, khi người dùng F5 tại
    # /dashboard hoặc /exam/... sẽ không bị Nginx trả 404.
    # ========================================================

    location / {
        try_files $uri $uri/ /index.html;
    }


    # ========================================================
    # BACKEND API — Reverse Proxy
    # ========================================================
    #
    # Các request bắt đầu bằng /api/ sẽ không tìm file frontend.
    # Nginx chuyển tiếp request tới ASP.NET API container.
    #
    # Ví dụ:
    #
    #   Browser
    #       ↓
    #   /api/questions
    #       ↓
    #   Nginx
    #       ↓
    #   http://api:8080
    #       ↓
    #   ASP.NET API
    #
    # "api" là tên service/container trong Docker Compose.
    # Các container trong cùng Docker network có thể gọi nhau
    # bằng tên service.
    # ========================================================

    location /api/ {

        # Chuyển request /api/... tới API container port 8080.
        proxy_pass http://api:8080;

        # Sử dụng HTTP/1.1 khi Nginx giao tiếp với API.
        proxy_http_version 1.1;

        # Giữ lại domain mà client đã sử dụng.
        proxy_set_header Host $host;

        # Gửi IP thật của client tới Backend.
        proxy_set_header X-Real-IP $remote_addr;

        # Gửi danh sách các IP mà request đã đi qua.
        # Backend có thể dùng header này để biết IP gốc của client.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cho Backend biết request ban đầu sử dụng HTTP hay HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cho phép Nginx chờ API tối đa 300 giây khi API xử lý
        # request lâu, ví dụ import ZIP hoặc xử lý audio lớn.
        proxy_read_timeout 300s;
    }
}